grid:
  nx: 134
  ny: 51
  nw: 9
  dlat: 1.5
  dlon: 1.5
  lat_n: 85.5
  lat_s: 10.5
  lon_w: 120.0
  lon_e: 320.0

levels:
  pr:
  - 1.0
  - 0.85
  - 0.7
  - 0.5
  - 0.4
  - 0.3
  - 0.25
  - 0.2
  - 0.1
  pr_hpa:
  - 1000
  - 850
  - 700
  - 500
  - 400
  - 300
  - 250
  - 200
  - 100

# Pieces mirror reference inv3d {1},{2,3},{4..NL}. In the BALP convention K=1 is
# the lower-boundary theta (1000 hPa) and K=NL=9 is the upper-boundary theta
# (100 hPa); interior PV is K=2..8. surface isolates the surface heating.
pieces:
  surface:
    levels:
    - 1
    hpa: "1000 (θ)"
  lower:
    levels:
    - 2
    - 3
    - 4
    hpa: "850–500"
  upper:
    levels:
    - 5
    - 6
    - 7
    - 8
    - 9
    hpa: "400–200 + 100 (θ)"

pass_ab:
  imax: 5000
  omegs: 1.75
  thrs: 5.0e4

# Top boundary is 100 hPa (NON-uniform top Δσ 0.05→0.10). Pass C trips the
# top-boundary "started diverging" heuristic, but the per-cycle field is the
# converged state (benign) and this grid closes Σ-pieces better. Standard ω=1.4.
pass_c:
  max_iter: 10000
  max_outer: 10000
  omegs: 1.4
  omegh: 1.4
  part: 0.05
  thrsh: 0.01
  qmin: 0.01
  imap: 1
  inf: 1

# NOTE: qinvertp21_94.f HARDCODES MAX/MAXT/QMIN (it does not read them from
# stdin), so they are intentionally NOT listed here — tune them in the Fortran.
pass_d:
  omegs: 1.85
  omegh: 1.4
  part: 0.05
  thrsh: 0.1
  tscal: 1.0
  qscal: 1.0
  imap: 1
  inlin: 1
  iqd: 0
  ibc: 0

xsection:
  lat: 34.5
  var: v_induced
  contour: pv_anomaly
